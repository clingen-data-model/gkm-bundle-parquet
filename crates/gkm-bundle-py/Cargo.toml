[package]
name = "gkm-bundle-py"
description = "The Python bindings of gkm-bundle-core: the extension module gkm_bundle_parquet._core"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
gkm-bundle-core = { path = "../gkm-bundle-core" }
# The stable ABI from the oldest Python the package supports: one wheel per platform (ADR 0010 decision 6).
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }
