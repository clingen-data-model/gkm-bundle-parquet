name: ci

on:
  pull_request:
    # A PR that changes only docs runs no tests. Later patterns win, so the files a test reads
    # (docs/column-set-format.md, the spec and fixture READMEs) and all code still run the suite.
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!.claude/**"
      - "!LICENSE"
      - "docs/column-set-format.md"
      - "src/**"
      - "spec/**"
      - "schemas/**"
      - "tests/**"
      - "scripts/**"
  push:
    branches: [main]

# A newer push to a PR cancels its older runs; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      # Builds the Rust core (crates/, ADR 0010) with the runner's Rust toolchain.
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: cargo fmt --check && cargo clippy --all-targets -- -D warnings
      - run: uv run pytest -n auto
